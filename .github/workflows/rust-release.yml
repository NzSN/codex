# Fork release: Linux x86_64 binaries, published only to NzSN/codex.
name: rust-release

on:
  push:
    tags:
      - "rust-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  TARGET: x86_64-unknown-linux-musl
  CODEX_REPO_ROOT: ${{ github.workspace }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  tag-check:
    if: github.repository == 'NzSN/codex'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          assert tag.startswith("rust-v"), f"Unexpected release tag: {tag}"
          version = tag.removeprefix("rust-v")
          cargo_version = tomllib.loads(Path("codex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"]
          subprocess.run(
              ["python3", ".github/scripts/releases.py", version, "--workspace-version", cargo_version],
              check=True,
          )
          PYTHON

  build:
    needs: tag-check
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    env:
      CARGO_BUILD_JOBS: "2"
      # Archive sidecar symbols before stripping the shipped binaries.
      CARGO_PROFILE_RELEASE_STRIP: none
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Make space for the Rust release build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Install the release source's Rust toolchain and target
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          command = [
              "rustup", "toolchain", "install", toolchain["channel"],
              "--profile", toolchain.get("profile", "minimal"),
              "--no-self-update", "--target", os.environ["TARGET"],
          ]
          for component in toolchain.get("components", []):
              command.extend(["--component", component])
          subprocess.run(command, check=True)
          PYTHON
      - name: Use a hermetic Cargo home
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"
      - name: Verify the active Rust toolchain can compile for musl
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          cargo --version
          cat > "${RUNNER_TEMP}/release-target-smoke.rs" <<'RUST'
          #![no_std]
          pub fn release_target_smoke() {}
          RUST
          rustc --crate-name release_target_smoke --crate-type lib --emit metadata \
            --target "$TARGET" "${RUNNER_TEMP}/release-target-smoke.rs" \
            -o "${RUNNER_TEMP}/release-target-smoke.rmeta"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
          sudo apt-get install -y zstd
      - name: Configure checksum-verified V8 build inputs
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}
      - name: Build and hash the bundled sandbox
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | cut -d ' ' -f 1)"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          cargo build --locked --release --target "$TARGET" \
            --bin codex --bin codex-code-mode-host --bin codex-exec-server \
            --bin codex-responses-api-proxy --bin codex-app-server
      - name: Archive symbols and strip binaries
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$TARGET" --artifact-name "$TARGET" \
            --release-dir "target/${TARGET}/release" --archive-dir dist \
            --binaries "codex codex-code-mode-host codex-exec-server codex-responses-api-proxy codex-app-server"
      - name: Package CLI and app server with their resources
        run: |
          set -euo pipefail
          for bundle in primary app-server; do
            bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
              --target "$TARGET" --bundle "$bundle" \
              --entrypoint-dir "target/${TARGET}/release" --archive-dir dist
          done
          tar -C "target/${TARGET}/release" -czf "dist/codex-responses-api-proxy-${TARGET}.tar.gz" \
            codex-responses-api-proxy
          cp core/config.schema.json dist/config-schema.json
      - name: Smoke-test the packaged CLI
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP}/codex-release-smoke"
          mkdir -p "$smoke_dir"
          tar -xzf "dist/codex-package-${TARGET}.tar.gz" -C "$smoke_dir"
          "$smoke_dir/bin/codex" --version
          # The sandbox bytes must remain identical after packaging.
          packaged_bwrap="$(find "$smoke_dir" -type f -name bwrap -print -quit)"
          test -n "$packaged_bwrap"
          echo "${CODEX_BWRAP_SHA256}  ${packaged_bwrap}" | sha256sum --check -
      - name: Record source identity and artifact checksums
        run: |
          set -euo pipefail
          git rev-parse HEAD > dist/SOURCE_COMMIT
          (cd dist && sha256sum ./*) > "${RUNNER_TEMP}/codex-SHA256SUMS"
          mv "${RUNNER_TEMP}/codex-SHA256SUMS" dist/SHA256SUMS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-x86_64-release
          path: codex-rs/dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.repository == 'NzSN/codex'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64-release
          path: dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish only to NzSN/codex GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = NzSN/codex
          cat > release-notes.md <<'NOTES'
          Linux x86_64 build of the NzSN/codex fork.

          Download codex-package-x86_64-unknown-linux-musl.tar.gz and extract the entire archive to retain the bundled code-mode host, ripgrep, and sandbox resources.

          Assets include the CLI package, app-server package, responses API proxy, debug symbols, configuration schema, source commit, and SHA-256 checksums. These binaries are unsigned. Optional native voice runtime bundles are not included.
          NOTES
          args=(--repo NzSN/codex --title "${RELEASE_TAG#rust-v}" --notes-file release-notes.md)
          version="${RELEASE_TAG#rust-v}"
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          # Use the tag collection to distinguish a missing release from API errors.
          release_id="$(gh api --paginate repos/NzSN/codex/releases \
            --jq '.[] | [.tag_name, .id] | @tsv' \
            | awk -v tag="$RELEASE_TAG" '$1 == tag { print $2 }')"
          if [[ -z "$release_id" ]]; then
            gh release create "$RELEASE_TAG" dist/* "${args[@]}" --verify-tag
          else
            gh release upload "$RELEASE_TAG" dist/* --repo NzSN/codex --clobber
            gh release edit "$RELEASE_TAG" "${args[@]}" --draft=false
          fi
